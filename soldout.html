<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Delivered Customer Orders | House of Snowdrop</title>
    <!-- FontAwesome Library Link for Brand & Social Logos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Link to External Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-header {
            margin-top: 90px;
            text-align: center;
            padding: 2rem 5%;
            background-color: var(--primary);
            color: #fff;
        }

        .gallery-header h2 {
            font-size: 2.2rem;
            font-family: serif;
            margin-bottom: 0.5rem;
        }

        .catalog-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        @media screen and (max-width: 480px) {
            .grid-layout {
                grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
                gap: 0.75rem;
            }
        }

        .ref-overlay-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            padding: 3px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            z-index: 2;
        }
        
        /* Ensures the status badge looks clean over customer photos */
        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            background: #ef4444;
            z-index: 2;
        }
    </style>
</head>

<body>

    <!-- GLOBAL FIXED NAVBAR -->
    <header>
        <div class="logo-area">
            <div class="logo-container">
                <img src="images/logo.jpeg" alt="House of Snowdrop Logo" class="spinning-logo" id="clickable-logo" style="cursor: pointer;">
            </div>
            <div class="brand-text">
                <h1>House of Snowdrop</h1>
                <div class="datetime-display" id="live-datetime">Loading Date & Time...</div>
            </div>
        </div>
        <div class="hamburger" id="menu-toggle"><span></span><span></span><span></span></div>
        <nav class="nav-menu" id="nav-links">
            <a href="index.html" class="nav-item">Home Hub</a>
            <a href="gallery.html" class="nav-item">All Designs</a>
            <a href="instock.html" class="nav-item">In Stock Only</a>
            <a href="soldout.html" class="nav-item">Sold Out Archive</a>
            <a href="index.html#videos-col" class="nav-item">Social Adverts</a>
            <a href="index.html#ceo-desk" class="nav-item">CEO's Desk</a>
            <a href="index.html#contact-footer" class="nav-item">Find Our Store</a>
        </nav>
    </header>

    <!-- NEW REDESIGNED HEADING BANNER CONCEPT -->
    <section class="gallery-header">
        <h2>Delivered Customer Orders</h2>
        <p style="font-size: 1rem; color: #cbd5e1; font-weight: 300; letter-spacing: 0.5px;">Real clients making bold statements in House of Snowdrop bespoke couture</p>
    </section>

    <main class="catalog-container">
        <div class="grid-layout" id="soldout-grid-target"></div>
    </main>

    <div class="lightbox" id="lightbox-modal">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Maximized View">
    </div>

    <!-- LINK TO SHARED DATA SHEET SOURCE -->
    <script src="products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Live Clock Logic
            const timeBox = document.getElementById('live-datetime');
            const updateTime = () => { timeBox.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
            setInterval(updateTime, 1000); updateTime();

            // Mobile Menu Panels Toggles
            const menuToggle = document.getElementById('menu-toggle');
            const navLinks = document.getElementById('nav-links');
            
            menuToggle.addEventListener('click', () => { 
                navLinks.classList.toggle('active'); 
            });

            // Close sliding mobile panel drawer instantly when any nav item link is tapped
            const mobileMenuLinks = navLinks.querySelectorAll('.nav-item');
            mobileMenuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active'); 
                });
            });

            // Render loop processing elements flagged under 'Sold Out' status parameters
            const gridTarget = document.getElementById('soldout-grid-target');
            
            if (typeof galleryInventory !== 'undefined' && galleryInventory.length > 0) {
                const archivedItems = galleryInventory.filter(item => item.status === 'Sold Out');

                if (archivedItems.length > 0) {
                    archivedItems.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = 'gallery-item';
                        card.style.animationDelay = `${index * 0.04}s`;
                        card.style.position = 'relative';
                        card.innerHTML = `
                            <div class="ref-overlay-tag">Ref: ${item.id}</div>
                            <img src="${item.src}" alt="Delivered Customer Garment Showcase">
                            <div class="status-badge">Delivered</div>
                        `;
                        card.addEventListener('click', () => {
                            document.getElementById('lightbox-img').src = item.src;
                            document.getElementById('lightbox-modal').style.display = 'flex';
                        });
                        gridTarget.appendChild(card);
                    });
                } else {
                    gridTarget.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#64748b;">No delivered order records found inside the catalog database layout track.</p>`;
                }
            } else {
                gridTarget.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#64748b;">Database link error. Verify your products.js initialization configurations.</p>`;
            }

            // Universal Lightbox Modal Control Closures
            const brandLogo = document.getElementById('clickable-logo');
            if (brandLogo) {
                brandLogo.addEventListener('click', () => {
                    document.getElementById('lightbox-img').src = brandLogo.src;
                    document.getElementById('lightbox-modal').style.display = 'flex';
                });
            }

            document.getElementById('lightbox-close').addEventListener('click', () => { document.getElementById('lightbox-modal').style.display = 'none'; });
            document.getElementById('lightbox-modal').addEventListener('click', (e) => { if (e.target === document.getElementById('lightbox-modal')) document.getElementById('lightbox-modal').style.display = 'none'; });
        });
    </script>
</body>

</html>
