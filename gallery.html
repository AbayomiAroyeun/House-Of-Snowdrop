<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Master Catalog | House of Snow Drop</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- GLOBAL FIXED NAVBAR -->
    <header>
        <div class="logo-area">
            <div class="logo-container">
                <img src="images/logo.jpeg" alt="House of Snow Drop Logo" class="spinning-logo" id="clickable-logo"
                    style="cursor: pointer;">
            </div>
            <div class="brand-text">
                <h1>House of Snow Drop</h1>
                <div class="datetime-display" id="gallery-datetime">Loading Date & Time...</div>
            </div>
        </div>

        <div class="hamburger" id="menu-toggle">
            <span></span><span></span><span></span>
        </div>

        <!-- Corrected Cross-Page Anchors returning to index.html sections -->
        <nav class="nav-menu" id="nav-links">
            <a href="index.html" class="nav-item">Home Hub</a>
            <a href="gallery.html" class="nav-item">All Designs</a>
            <a href="instock.html" class="nav-item">In Stock Only</a>
            <a href="soldout.html" class="nav-item">Sold Out Archive</a>
            <a href="index.html#videos-col" class="nav-item">Social Adverts</a>
            <a href="index.html#ceo-desk" class="nav-item">CEO's Desk</a>
            <a href="index.html#contact-footer" class="nav-item">Find Our Store</a>
        </nav>
    </header>

    <section class="hero" style="height: 25vh; margin-top: 70px;">
        <h2>The Master Collection</h2>
        <p>Quote reference codes when reaching out to order custom garments</p>
    </section>

    <main style="max-width: 1400px; margin: 2rem auto; padding: 0 5%;">
        <div style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <a href="instock.html" class="ceo-btn" style="margin-top:0; background:#10b981;">🟢 Browse Available
                Stock</a>
            <a href="soldout.html" class="ceo-btn" style="margin-top:0; background:#ef4444;">🔴 Browse Vault Archive</a>
        </div>

        <div class="gallery-grid" id="master-gallery"></div>
    </main>

    <div class="lightbox" id="lightbox-modal">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Maximized View">
    </div>

    <script>
        const galleryInventory = [
            { id: "HSD-001", src: 'images/image1.jpeg', status: 'In Stock' },
            { id: "HSD-002", src: 'images/image2.jpeg', status: 'Sold Out' },
            { id: "HSD-003", src: 'images/image3.jpeg', status: 'In Stock' },
            { id: "HSD-004", src: 'images/image4.jpeg', status: 'Sold Out' },
            { id: "HSD-005", src: 'images/image5.jpeg', status: 'In Stock' },
            { id: "HSD-006", src: 'images/image6.jpeg', status: 'In Stock' },
            { id: "HSD-007", src: 'images/image7.jpeg', status: 'Sold Out' },
            { id: "HSD-008", src: 'images/image8.jpeg', status: 'In Stock' },
            { id: "HSD-009", src: 'images/image9.jpeg', status: 'Sold Out' },
            { id: "HSD-010", src: 'images/image10.jpeg', status: 'In Stock' },
            { id: "HSD-011", src: 'images/image11.jpeg', status: 'Sold Out' },
            { id: "HSD-012", src: 'images/image12.jpeg', status: 'In Stock' },
            { id: "HSD-013", src: 'images/image13.jpeg', status: 'Sold Out' },
            { id: "HSD-014", src: 'images/image14.jpeg', status: 'In Stock' },
            { id: "HSD-015", src: 'images/image15.jpeg', status: 'In Stock' },
            { id: "HSD-016", src: 'images/image16.jpeg', status: 'Sold Out' },
            { id: "HSD-017", src: 'images/image17.jpeg', status: 'In Stock' },
            { id: "HSD-018", src: 'images/image18.jpeg', status: 'Sold Out' },
            { id: "HSD-019", src: 'images/image19.jpeg', status: 'In Stock' },
            { id: "HSD-020", src: 'images/image20.jpeg', status: 'In Stock' },
            { id: "HSD-021", src: 'images/image21.jpeg', status: 'In Stock' },
            { id: "HSD-022", src: 'images/image22.jpeg', status: 'Sold Out' },
            { id: "HSD-023", src: 'images/image23.jpeg', status: 'In Stock' },
            { id: "HSD-024", src: 'images/image24.jpeg', status: 'Sold Out' },
            { id: "HSD-025", src: 'images/image25.jpeg', status: 'In Stock' },
            { id: "HSD-026", src: 'images/image26.jpeg', status: 'In Stock' },
            { id: "HSD-027", src: 'images/image27.jpeg', status: 'Sold Out' },
            { id: "HSD-028", src: 'images/image28.jpeg', status: 'In Stock' },
            { id: "HSD-029", src: 'images/image29.jpeg', status: 'Sold Out' },
            { id: "HSD-030", src: 'images/image30.jpeg', status: 'In Stock' },
            { id: "HSD-031", src: 'images/image31.jpeg', status: 'Sold Out' },
            { id: "HSD-032", src: 'images/image32.jpeg', status: 'In Stock' },
            { id: "HSD-033", src: 'images/image33.jpeg', status: 'Sold Out' },
            { id: "HSD-034", src: 'images/image34.jpeg', status: 'In Stock' },
            { id: "HSD-035", src: 'images/image35.jpeg', status: 'In Stock' },
            { id: "HSD-036", src: 'images/image36.jpeg', status: 'Sold Out' }
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const timeBox = document.getElementById('gallery-datetime');
            const updateTime = () => {
                timeBox.textContent = new Date().toLocaleDateString('en-US', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            };
            setInterval(updateTime, 1000); updateTime();

            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.getElementById('nav-links').classList.toggle('active');
            });

            const container = document.getElementById('master-gallery');
            const shuffledItems = shuffle([...galleryInventory]);

            // Staggered sequential column-by-column fade calculation mechanics
            shuffledItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-item';

                // Keeps the smooth sequential fade layout trigger delay intact
                card.style.animationDelay = `${index * 0.1}s`;

                // REWRITTEN: Stamped with ONLY the reference identification label overlay
                card.innerHTML = `
        <img src="${item.src}" alt="Ankara Design Architecture">
        <div style="position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; font-weight: bold; z-index:10;">
            Ref: ${item.id}
        </div>
    `;
                card.addEventListener('click', () => {
                    document.getElementById('lightbox-img').src = item.src;
                    document.getElementById('lightbox-modal').style.display = 'flex';
                });
                container.appendChild(card);
            });

            // Logo Lightbox connection hooks
            const brandLogo = document.getElementById('clickable-logo');
            if (brandLogo) {
                brandLogo.addEventListener('click', () => {
                    document.getElementById('lightbox-img').src = brandLogo.src;
                    document.getElementById('lightbox-modal').style.display = 'flex';
                });
            }

            document.getElementById('lightbox-close').addEventListener('click', () => { document.getElementById('lightbox-modal').style.display = 'none'; });
            document.getElementById('lightbox-modal').addEventListener('click', (e) => { if (e.target === document.getElementById('lightbox-modal')) document.getElementById('lightbox-modal').style.display = 'none'; });
        });
    </script>
</body>

</html>
